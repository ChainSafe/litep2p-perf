[package]
name = "litep2p-perf"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5.31", features = ["derive", "cargo"] }
tokio = { version = "1.28", features = ["macros", "time", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1.34"
futures = "0.3.28"

#litep2p = { git = "https://github.com/paritytech/litep2p", branch = "master", features = ["websocket", "webrtc"] }
litep2p = { git = "https://github.com/ChainSafe/litep2p", branch = "tim/impl-backpressure", features = ["websocket", "webrtc"] }

utils = { path = "../utils" }
