[package]
name = "smoldot-automation"
version = "0.1.0"
edition = "2024"

[dependencies]
headless_chrome = "1.0.20"
rouille = "3.6.2"
serde = { version = "1.0.228", features = ["derive"] }
utils = { path = "../utils" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1.34"
clap = { version = "4.5", features = ["derive"] }
pcap-file = "2.0"
prost = "0.13"
chrono = "0.4"
comfy-table = "7.1"
anyhow = "1.0"

[build-dependencies]
prost-build = "0.13"
